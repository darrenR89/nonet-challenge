<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nonet</title>
    <link rel="modulepreload" href="splash.js">
    <link rel="stylesheet" href="splash.css">
  </head>
  <body class="fd">
    <main class="fd-card">
      <svg
        class="fd-fold"
        id="foldsvg"
        viewBox="0 0 1100 520"
        role="img"
        aria-label="Nonet"
      ></svg>
      <h1 class="fd-sr">
        A sudoku cube, one a day, the same for everyone on Reddit.
      </h1>
      <div class="fd-foot">
        <div class="fd-info">
          <p class="fd-day" id="day">Today's cube</p>
          <p class="fd-live" id="live" aria-live="polite"></p>
        </div>
        <button class="fd-play" id="start-btn" type="button">
          Play today's cube
        </button>
      </div>
    </main>
    <script src="splash.js" type="module"></script>
  </body>
</html>
